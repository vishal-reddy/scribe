name: Weekly security review

# An agy-driven reviewer fixes clear security issues on a branch, opens a PR, has a second
# agent session review it, and merges only if that review says SAFE. See scripts/security-agent/run.sh.
# Runs on the dedicated `security-agent` runner (an unprivileged user with agy signed in).
on:
  # TEMPORARY: first test run from the PR branch; remove before merging.
  push:
    branches: [feat/weekly-security-agent]
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      merge:
        description: "Merge the PR if the reviewer says SAFE (false = open the PR only)"
        type: boolean
        default: true

concurrency:
  group: security-review
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    name: Security review (agy)
    runs-on: [self-hosted, security-agent]
    timeout-minutes: 90
    env:
      # With SECURITY_AGENT_TOKEN unset, gh uses the login stored for the runner user (admin, so it can merge
      # past the required-review rule). The default token alone can neither create nor merge these PRs.
      GH_TOKEN: ${{ secrets.SECURITY_AGENT_TOKEN }}
      MERGE: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.merge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Run the security agent
        run: bash scripts/security-agent/run.sh
