name = "scribe"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "scribe.kecker.co", custom_domain = true }
]

[observability]
enabled = true

[triggers]
# Daily sweep: delete expired ephemeral notes (and their sourced feed posts).
crons = ["0 6 * * *"]

[vars]
ENVIRONMENT = "production"
EMAIL_FROM = "Scribe <no-reply@kecker.co>"
# Comma-separated list of allowed CORS origins for production
# ALLOWED_ORIGINS = "https://scribe.example.com"

# Shared Kinde business every Kecker.co app authenticates against — see
# ../base/apps/backend/docs/KINDE_SETUP.md for the pattern. KINDE_CLIENT_ID is
# the "Scribe Web" application (confidential, has a secret) used only by
# /auth/kinde/login's backend-hosted flow — iOS and Android each sign into
# their own native Kinde application client-side ("Scribe iOS" / "Scribe
# Android") and never reach that route. Legacy email-OTP tokens are still
# accepted alongside Kinde JWTs for now — see src/middleware/auth.ts.
KINDE_DOMAIN = "https://kecker.kinde.com"
KINDE_CLIENT_ID = "4e98217c88d24e728fc3b0c15e73e770"
KINDE_AUDIENCE = "https://scribe.kecker.co"

# In production, set via: wrangler secret put ANTHROPIC_API_KEY
#   KINDE_CLIENT_SECRET — "Scribe Web" Kinde application's client secret
# For local dev, add to .dev.vars file

[[durable_objects.bindings]]
name = "DOCUMENT_SYNC"
class_name = "DocumentSync"

[[durable_objects.bindings]]
name = "SCRIBE_MCP"
class_name = "ScribeMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DocumentSync", "ScribeMCP"]

[[d1_databases]]
binding = "DB"
database_name = "scribe-db"
database_id = "4f10070e-b7be-4922-916d-a41765388d46"
migrations_dir = "src/db/migrations"

# ---------------------------------------------------------------------------------------------------------------
# Dev environment: `wrangler deploy --env dev`  ->  scribe-dev at scribe-dev.kecker.co with its own D1 and Durable
# Objects. Wrangler does not inherit bindings or vars into an environment, so everything is repeated.
# Provision once with scripts/provision-dev.sh. See kecker-mcp-hub/docs/ENVIRONMENTS.md.
# ---------------------------------------------------------------------------------------------------------------
[env.dev]
name = "scribe-dev"
routes = [
  { pattern = "scribe-dev.kecker.co", custom_domain = true }
]

[env.dev.observability]
enabled = true

[env.dev.triggers]
crons = ["0 6 * * *"]

[env.dev.vars]
ENVIRONMENT = "development"
APP_BASE_URL = "https://scribe-dev.kecker.co"
HUB_URL = "https://mcp-dev.kecker.co"
EMAIL_FROM = "Scribe Dev <no-reply@kecker.co>"
KINDE_DOMAIN = "https://kecker.kinde.com"
# Same "Scribe Web" Kinde application as prod; its allowed callback URLs must also list https://scribe-dev.kecker.co/...
KINDE_CLIENT_ID = "4e98217c88d24e728fc3b0c15e73e770"
# A separate Kinde API for the dev host (audience == the dev origin).
KINDE_AUDIENCE = "https://scribe-dev.kecker.co"

[[env.dev.durable_objects.bindings]]
name = "DOCUMENT_SYNC"
class_name = "DocumentSync"

[[env.dev.durable_objects.bindings]]
name = "SCRIBE_MCP"
class_name = "ScribeMCP"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["DocumentSync", "ScribeMCP"]

[[env.dev.d1_databases]]
binding = "DB"
database_name = "scribe-db-dev"
# Filled in by scripts/provision-dev.sh. Deploying with this placeholder fails loudly, which is intended.
database_id = "REPLACE_WITH_DEV_D1_ID"
migrations_dir = "src/db/migrations"
